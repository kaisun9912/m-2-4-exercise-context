name: deploy 
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm build


